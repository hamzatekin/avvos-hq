name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: void-cloudflare-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add a CLOUDFLARE_API_TOKEN repository secret (Settings > Secrets and variables > Actions), then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # void deploy lists accounts through `wrangler whoami` unless it is told which
      # account to use, and an API token often cannot do that. Pin the account here.
      - name: Pick the Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$ACCOUNT_ID_VAR" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID_VAR" >> "$GITHUB_ENV"
            exit 0
          fi
          body=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
          count=$(echo "$body" | jq '.result | length? // 0')
          if [ "$(echo "$body" | jq -r '.success')" != "true" ] || [ "$count" -lt 1 ]; then
            echo "::error::The token cannot list Cloudflare accounts: $(echo "$body" | jq -c '.errors'). Set a CLOUDFLARE_ACCOUNT_ID repository variable, or give the token Account Settings: Read."
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "::error::The token can reach $count Cloudflare accounts. Set a CLOUDFLARE_ACCOUNT_ID repository variable to pick one."
            exit 1
          fi
          echo "Using Cloudflare account: $(echo "$body" | jq -r '.result[0].name')"
          echo "CLOUDFLARE_ACCOUNT_ID=$(echo "$body" | jq -r '.result[0].id')" >> "$GITHUB_ENV"
      # Fails early, with a reason, when the Access service token is not let in.
      - name: Check the Access service token
        env:
          ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          URL: https://avvos-hq.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN || 'hmztkn' }}.workers.dev/
        run: |
          if [ -z "$ID" ] || [ -z "$SECRET" ]; then
            echo "No Access service token set; skipping."
            exit 0
          fi
          case "$ID" in *.access) ;; *) echo "::warning::CF_ACCESS_CLIENT_ID should end in .access (copy only the value, not the header name).";; esac
          case "$ID$SECRET" in *" "*|*:*) echo "::warning::The Access secrets contain a space or colon; copy only the values, not the header names.";; esac
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "CF-Access-Client-Id: $ID" -H "CF-Access-Client-Secret: $SECRET" "$URL")
          echo "Access answered HTTP $code for $URL with the service token"
          if [ "$code" != "200" ]; then
            echo "::error::Access did not let the service token in (HTTP $code). Check that the Worker's Access application has a Service Auth policy that includes this token."
            exit 1
          fi
      - name: Deploy
        env:
          # Add this scoped token at Settings → Secrets and variables → Actions.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The account's workers.dev subdomain (aletheia.hmztkn.workers.dev lives there too).
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN || 'hmztkn' }}
          # The Worker sits behind Cloudflare Access, so void's readiness check needs an
          # Access service token that a Service Auth policy on the Worker lets in.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: pnpm exec void deploy --platform cloudflare
